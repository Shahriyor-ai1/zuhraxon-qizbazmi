<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Samandarjon &amp; Zuhraxon — Qiz bazmi">
<meta property="og:description" content="12-dekabr 2026, soat 10:00 · “O‘zbegim” to‘yxonasi, Dehqonobod shaharchasi">
<title>Zuhraxon Qiz Bazmi</title>
<meta name="theme-color" content="#6e1423">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ⚙️  SOZLAMALAR — faqat shu qismni o'zgartiring
   (pastdagi <script> ichidagi CONFIG obyektida)
   ========================================================= */
:root{
  --wine:#6e1423; --wine-2:#8b1e2f; --wine-3:#4a0d18;
  --gold:#c9a45c; --gold-2:#e2c88f;
  --cream:#fbf5ea; --cream-2:#f4e7d2; --paper:#fffaf2;
  --ink:#3b1a1f; --muted:#8a6f63;
  --serif:'Cormorant Garamond',Georgia,serif;
  --script:'Great Vibes',cursive;
  --sans:'Montserrat',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream-2);color:var(--ink);font-family:var(--serif);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden;height:100vh}
.wrap{max-width:480px;margin:0 auto;background:var(--paper);min-height:100vh;position:relative;overflow:hidden;box-shadow:0 0 60px rgba(110,20,35,.12)}

/* ---------- Ochilish ekrani ---------- */
#cover{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(ellipse at 50% 20%,#efe3d6 0%,#b99891 35%,#7a2a35 70%,#3a0b14 100%);transition:opacity 1s ease,visibility 1s}
#cover.hide{opacity:0;visibility:hidden}
.seal{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#a8323f,#6e1423 60%,#4a0d18);box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 -4px 10px rgba(0,0,0,.3);
  color:var(--gold-2);font-family:var(--script);font-size:38px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.cover-label{font-family:var(--sans);letter-spacing:.32em;font-size:11px;color:var(--gold-2);text-transform:uppercase}
.cover-names{font-family:var(--script);font-size:44px;color:#fff6ea;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.btn{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;border:none;cursor:pointer;
  padding:15px 30px;border-radius:999px;transition:transform .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn-wine{background:linear-gradient(135deg,var(--wine-2),var(--wine-3));color:#fff;box-shadow:0 6px 20px rgba(74,13,24,.45);border:1px solid rgba(226,200,143,.5)}
.btn-gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--wine-3)}
.btn-ghost{background:#fff;color:var(--wine);border:1px solid #ead9c2;width:100%}

/* ---------- Gul barglari ---------- */
#petals{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.petal{position:absolute;top:-40px;opacity:.85;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}

/* ---------- Musiqa tugmasi ---------- */
#music{position:fixed;right:16px;bottom:18px;z-index:45;width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);
  background:var(--wine);color:var(--gold-2);display:none;place-items:center;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.25)}
#music.on svg{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Hero ---------- */
.hero{padding:70px 28px 40px;text-align:center;position:relative}
.corner{position:absolute;width:120px;opacity:.9;pointer-events:none}
.corner.tl{top:0;left:0}
.corner.tr{top:0;right:0;transform:scaleX(-1)}
.orn{color:var(--gold);font-size:18px;display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto}
.orn::before,.orn::after{content:"";height:1px;width:60px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{transform:scaleX(-1)}
.eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);margin:22px 0 14px}
.names{font-family:var(--serif);font-weight:500;color:var(--wine);font-size:clamp(48px,15vw,68px);line-height:1;letter-spacing:.04em;text-transform:uppercase}
.names.two{font-size:clamp(34px,10.5vw,50px);letter-spacing:.03em}
.amp{display:block;font-family:var(--script);color:var(--gold);text-transform:none;font-size:.8em;margin:4px 0}
.script{font-family:var(--script);color:var(--gold);font-size:clamp(34px,10vw,44px);margin-top:18px}
.lead{font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);margin-top:10px;line-height:1.8}

/* ---------- Rasm arkasi ---------- */
.arch-wrap{display:flex;justify-content:center;padding:10px 0 70px;position:relative}
.arch{width:78%;max-width:300px;aspect-ratio:3/4;border-radius:999px 999px 14px 14px;padding:8px;
  background:linear-gradient(180deg,var(--gold-2),var(--gold));box-shadow:0 18px 40px rgba(110,20,35,.18);position:relative}
.arch-in{width:100%;height:100%;border-radius:999px 999px 8px 8px;overflow:hidden;background:linear-gradient(160deg,#f3e1d0,#d9b7a6)}
.arch-in img{width:100%;height:100%;object-fit:cover;display:block}
.arch-ph{width:100%;height:100%;display:grid;place-items:center;font-family:var(--script);font-size:56px;color:var(--wine)}
.rose{position:absolute;bottom:-14px;width:46px}
.rose.l{left:-14px}.rose.r{right:-14px;transform:scaleX(-1)}

/* ---------- To'q qizil bo'lim ---------- */
.wine{background:linear-gradient(180deg,var(--wine-2) 0%,var(--wine) 40%,var(--wine-3) 100%);color:#f8eadb;position:relative;padding:20px 24px 70px;text-align:center}
.wave{position:absolute;top:-58px;left:0;width:100%;height:60px;display:block}
.medal{width:40px;height:40px;border-radius:50%;margin:-40px auto 22px;background:var(--wine-3);border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold-2);font-size:14px;position:relative;z-index:2}
.h-cap{font-family:var(--sans);font-size:12px;letter-spacing:.36em;text-transform:uppercase;color:var(--gold-2)}
.datebox{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:28px auto 0;max-width:340px;
  border:1px solid rgba(226,200,143,.35);border-radius:16px;background:rgba(255,255,255,.04);padding:20px 8px}
.datebox .side{font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#f1dcc4}
.datebox .day{font-family:var(--serif);font-size:84px;line-height:.9;color:var(--gold-2);padding:0 18px;border-left:1px solid rgba(226,200,143,.35);border-right:1px solid rgba(226,200,143,.35)}
.year{font-family:var(--serif);font-size:26px;letter-spacing:.3em;margin-top:14px;color:#f1dcc4}
.time{font-family:var(--serif);font-size:20px;letter-spacing:.18em;margin-top:22px;text-transform:uppercase}
.divider{height:1px;width:120px;margin:42px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.venue-name{font-family:var(--serif);font-size:30px;font-weight:500;margin:14px 0 6px;color:#fff}
.venue-addr{font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#e9cfb3;line-height:1.8}
.wine .btn-gold{margin-top:22px;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.quote{font-style:italic;font-size:20px;line-height:1.5;margin:0 auto;max-width:320px;color:#f7e6d4}

.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:28px}
.cbox{border:1px solid rgba(226,200,143,.4);border-radius:14px;padding:14px 4px;background:rgba(0,0,0,.12)}
.cbox b{display:block;font-family:var(--serif);font-weight:500;font-size:34px;color:var(--gold-2);line-height:1}
.cbox span{font-family:var(--sans);font-size:9px;letter-spacing:.2em;color:#e9cfb3;margin-top:6px;display:block}

/* ---------- Kartalar ---------- */
.card{background:var(--paper);color:var(--ink);border-radius:20px;padding:26px 22px;margin-top:34px;text-align:left;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.card h3{font-family:var(--serif);font-weight:500;font-size:30px;color:var(--wine);text-align:center;margin-bottom:18px}
label{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px}
input,select,textarea{width:100%;font-family:var(--serif);font-size:18px;color:var(--ink);background:#fff;border:1px solid #ead9c2;border-radius:12px;padding:12px 14px;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:96px;resize:vertical}
.card .btn-wine{width:100%;margin-top:20px}
.ok{display:none;text-align:center;font-size:20px;color:var(--wine);padding:10px 0}
.ok.show{display:block}

.bank{border-radius:16px;padding:22px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#7a1a2a,#4a0d18);box-shadow:0 12px 26px rgba(74,13,24,.35)}
.bank::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.07)}
.chip{width:42px;height:30px;border-radius:6px;background:linear-gradient(135deg,#f0d58e,#b8913f)}
.bank .num{font-family:var(--sans);font-size:19px;letter-spacing:.14em;margin:26px 0 14px;white-space:nowrap}
.bank .owner{font-family:var(--sans);font-size:11px;letter-spacing:.18em;font-weight:600;text-transform:uppercase}
.card .btn-ghost{margin-top:14px;display:flex;gap:8px;justify-content:center;align-items:center}

.wishes{margin-top:18px;display:flex;flex-direction:column;gap:12px;max-height:340px;overflow:auto}
.wish{background:#fff;border:1px solid #f0e2cd;border-radius:14px;padding:14px 16px}
.wish b{font-family:var(--serif);font-size:19px;color:var(--wine);font-weight:600}
.wish p{font-size:17px;line-height:1.45;margin-top:4px;color:var(--ink)}

footer{text-align:center;padding:50px 20px 60px;background:var(--wine-3);color:#e9cfb3}
footer .script{margin:0;font-size:40px}
footer small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.28em;margin-top:10px;text-transform:uppercase}

.toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-family:var(--sans);font-size:13px;
  padding:11px 18px;border-radius:999px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Paydo bo'lish animatsiyasi ---------- */
.rv{opacity:0;transform:translateY(26px);transition:opacity 1s ease,transform 1s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.petal,.seal{animation:none}}
:root{color-scheme:light}
</style>
<script>document.documentElement.lang="uz";document.addEventListener("DOMContentLoaded",()=>{});</script>

</head>
<body>
<!-- ============ OCHILISH EKRANI ============ -->
<div id="cover">
  <div class="seal" id="sealLetters">Z</div>
  <div class="cover-label">Siz uchun taklifnoma</div>
  <div class="cover-names" id="coverNames"></div>
  <button class="btn btn-wine" id="openBtn">Taklifnomani ochish</button>
</div>

<div id="petals"></div>
<button id="music" aria-label="Musiqa">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
</button>
<audio id="audio" loop preload="none"></audio>

<main class="wrap">
  <!-- ============ HERO ============ -->
  <section class="hero">
    <svg class="corner tl" viewBox="0 0 120 120" aria-hidden="true">
      <path d="M0 40 Q30 30 40 0" stroke="#c9a45c" stroke-width="1" fill="none"/>
      <path d="M0 70 Q55 55 70 0" stroke="#c9a45c" stroke-width=".6" fill="none" opacity=".6"/>
      <g transform="translate(26 26)"><circle r="12" fill="#8b1e2f"/><circle r="7" fill="#a8323f"/><circle r="3" fill="#6e1423"/></g>
      <g transform="translate(50 12)"><circle r="7" fill="#b84a58"/><circle r="3" fill="#8b1e2f"/></g>
      <g transform="translate(12 52)"><circle r="7" fill="#b84a58"/><circle r="3" fill="#8b1e2f"/></g>
      <ellipse cx="44" cy="34" rx="9" ry="4" fill="#6b7a4a" transform="rotate(35 44 34)"/>
      <ellipse cx="34" cy="46" rx="9" ry="4" fill="#7d8c58" transform="rotate(60 34 46)"/>
    </svg>
    <svg class="corner tr" viewBox="0 0 120 120" aria-hidden="true">
      <path d="M0 40 Q30 30 40 0" stroke="#c9a45c" stroke-width="1" fill="none"/>
      <g transform="translate(26 26)"><circle r="12" fill="#8b1e2f"/><circle r="7" fill="#a8323f"/><circle r="3" fill="#6e1423"/></g>
      <g transform="translate(50 12)"><circle r="7" fill="#b84a58"/><circle r="3" fill="#8b1e2f"/></g>
      <ellipse cx="44" cy="34" rx="9" ry="4" fill="#6b7a4a" transform="rotate(35 44 34)"/>
    </svg>

    <div class="orn rv">❖</div>
    <p class="eyebrow rv" id="eyebrow"></p>
    <h1 class="names two rv"><span id="groom"></span><span class="amp">va</span><span id="bride"></span></h1>
    <p class="lead rv" id="subtitle" style="margin-top:18px"></p>
    <p class="script rv" id="eventTitle" style="margin-top:6px"></p>
    <p class="lead rv">Sizni mamnuniyat bilan<br>taklif qilamiz</p>
    <div class="orn rv" style="margin-top:26px">✦</div>
  </section>

  <div class="arch-wrap rv">
    <div class="arch">
      <div class="arch-in" id="photoBox"></div>
      <svg class="rose l" viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" fill="#8b1e2f"/><circle cx="20" cy="20" r="9" fill="#a8323f"/><circle cx="20" cy="20" r="4" fill="#5a1020"/></svg>
      <svg class="rose r" viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" fill="#8b1e2f"/><circle cx="20" cy="20" r="9" fill="#a8323f"/><circle cx="20" cy="20" r="4" fill="#5a1020"/></svg>
    </div>
  </div>

  <!-- ============ TO'Q QIZIL BO'LIM ============ -->
  <section class="wine">
    <svg class="wave" viewBox="0 0 480 60" preserveAspectRatio="none"><path d="M0 40 Q120 0 240 30 T480 20 V60 H0z" fill="#8b1e2f"/></svg>
    <div class="medal">❖</div>

    <p class="h-cap rv">Sanani saqlab qo'ying</p>
    <div class="datebox rv">
      <div class="side" id="weekday"></div>
      <div class="day" id="dayNum"></div>
      <div class="side" id="month"></div>
    </div>
    <p class="year rv" id="year"></p>
    <p class="time rv" id="time"></p>

    <div class="divider"></div>

    <p class="h-cap rv">Manzil</p>
    <p class="venue-name rv" id="venueName"></p>
    <p class="venue-addr rv" id="venueAddr"></p>
    <a class="btn btn-gold rv" id="mapBtn" target="_blank" rel="noopener">📍 Xaritada ochish</a>

    <div class="divider"></div>

    <p class="quote rv" id="quote"></p>
    <div class="count rv">
      <div class="cbox"><b id="cd-d">0</b><span>KUN</span></div>
      <div class="cbox"><b id="cd-h">0</b><span>SOAT</span></div>
      <div class="cbox"><b id="cd-m">0</b><span>DAQIQA</span></div>
      <div class="cbox"><b id="cd-s">0</b><span>SONIYA</span></div>
    </div>

    <!-- Tashrif -->
    <div class="card rv" id="rsvpCard">
      <h3>Tashrif</h3>
      <form id="rsvp">
        <label for="rName">Ism va familiyangiz</label>
        <input id="rName" required autocomplete="name">
        <label for="rStatus">Tashrif holati</label>
        <select id="rStatus" required>
          <option value="">Tanlang...</option>
          <option>Ha, boraman</option>
          <option>Afsuski, bora olmayman</option>
          <option>Borishga harakat qilaman</option>
        </select>
        <label for="rCount">Necha kishi bo'lasiz</label>
        <input id="rCount" type="number" min="1" max="20" value="1">
        <button class="btn btn-wine" type="submit">Tasdiqlash</button>
      </form>
      <p class="ok" id="rsvpOk">Rahmat! Javobingiz qabul qilindi 🌸</p>
    </div>

    <!-- To'yona -->
    <div class="card rv" id="giftCard">
      <h3>To'yona uchun</h3>
      <div class="bank">
        <div class="chip"></div>
        <div class="num" id="cardNum"></div>
        <div class="owner" id="cardOwner"></div>
      </div>
      <button class="btn btn-ghost" id="copyBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        Karta raqamini nusxalash
      </button>
    </div>

    <!-- Tilaklar -->
    <div class="card rv">
      <h3>Tilaklaringizni yozib qoldiring</h3>
      <form id="wishForm">
        <label for="wName">Ismingiz</label>
        <input id="wName" required>
        <label for="wText">Tilagingiz</label>
        <textarea id="wText" required></textarea>
        <button class="btn btn-wine" type="submit">Tilak yuborish</button>
      </form>
      <div class="wishes" id="wishes"></div>
    </div>
  </section>

  <footer>
    <p class="script" id="footNames"></p>
    <small>Sizni kutib qolamiz</small>
  </footer>
</main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ⚙️  SOZLAMALAR — taklifnomani shu yerdan o'zgartiring
   ========================================================= */
const CONFIG = {
  groom: "Samandarjon",
  bride: "Zuhraxon",
  eyebrow: "Aziz mehmonlar",
  subtitle: "Nikoh to'ylari munosabati bilan<br>tashkil etilayotgan",
  eventTitle: "Qiz bazmiga",
  date:  "2026-12-12T10:00:00",          // Yil-Oy-Kun T Soat:Daqiqa
  timeText: "Soat 10:00 da",
  venueName: "\"O'zbegim\" to'yxonasi",
  venueAddr: "Guliston tumani, Dehqonobod shaharchasi",
  mapUrl: "https://yandex.uz/maps/?text=" + encodeURIComponent("O'zbegim to'yxonasi Dehqonobod Guliston"),
  quote: "Samandarjon va Zuhraxonlarning nikoh to'ylari munosabati bilan tashkil etilayotgan Qiz bazmiga sizni mamnuniyat bilan taklif qilamiz",
  photo: "",                              // masalan: "rasm.jpg" (shu papkaga qo'ying). Bo'sh bo'lsa, bosh harflar chiqadi
  music: "",                              // masalan: "musiqa.mp3". Bo'sh bo'lsa, musiqa tugmasi chiqmaydi
  cardNumber: "9860 2601 0134 7789",      // bo'sh bo'lsa, to'yona bo'limi yashiriladi
  cardOwner: "Jabborova Zuhra",
  showRsvp: true,
  wishes: []                              // oldindan ko'rinadigan tilaklar (ixtiyoriy)
};
/* ========================================================= */

document.body.classList.add("locked");
const $ = id => document.getElementById(id);
const WEEK = ["Yakshanba","Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba"];
const MON  = ["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"];
const d = new Date(CONFIG.date);

const couple = `${CONFIG.groom} & ${CONFIG.bride}`;
document.title = `${couple} — Qiz bazmi`;
$("groom").textContent = CONFIG.groom;
$("bride").textContent = CONFIG.bride;
$("eyebrow").textContent = CONFIG.eyebrow;
$("subtitle").innerHTML = CONFIG.subtitle;
$("eventTitle").textContent = CONFIG.eventTitle;
$("coverNames").textContent = couple;
$("footNames").textContent = couple;
$("sealLetters").textContent = CONFIG.groom[0] + "&" + CONFIG.bride[0];
$("weekday").textContent = WEEK[d.getDay()];
$("dayNum").textContent = String(d.getDate()).padStart(2,"0");
$("month").textContent = MON[d.getMonth()];
$("year").textContent = d.getFullYear();
$("time").textContent = CONFIG.timeText;
$("venueName").textContent = CONFIG.venueName;
$("venueAddr").textContent = CONFIG.venueAddr;
$("mapBtn").href = CONFIG.mapUrl;
$("quote").textContent = CONFIG.quote;
$("cardNum").textContent = CONFIG.cardNumber;
$("cardOwner").textContent = CONFIG.cardOwner;
if (!CONFIG.cardNumber) $("giftCard").remove();
if (!CONFIG.showRsvp) $("rsvpCard").remove();

if (CONFIG.photo) {
  const img = new Image(); img.src = CONFIG.photo; img.alt = CONFIG.bride;
  $("photoBox").appendChild(img);
} else {
  $("photoBox").innerHTML = `<div class="arch-ph">${CONFIG.groom[0]} &amp; ${CONFIG.bride[0]}</div>`;
}
if (!CONFIG.wishes.length) $("wishes").style.marginTop = "0";

/* --- Ochish --- */
const audio = $("audio"), musicBtn = $("music");
if (CONFIG.music) { audio.src = CONFIG.music; musicBtn.style.display = "grid"; }
$("openBtn").onclick = () => {
  $("cover").classList.add("hide");
  document.body.classList.remove("locked");
  startPetals();
  if (CONFIG.music) audio.play().then(() => musicBtn.classList.add("on")).catch(()=>{});
};
musicBtn.onclick = () => {
  if (audio.paused) { audio.play(); musicBtn.classList.add("on"); }
  else { audio.pause(); musicBtn.classList.remove("on"); }
};

/* --- Gul barglari --- */
const PETAL = c => `<svg width="18" height="18" viewBox="0 0 20 20"><path d="M10 1C14 5 18 9 10 19 2 9 6 5 10 1z" fill="${c}"/></svg>`;
const COLORS = ["#8b1e2f","#a8323f","#c45a68","#d98a94","#c9a45c"];
function petal(){
  const el = document.createElement("div");
  el.className = "petal";
  el.innerHTML = PETAL(COLORS[Math.random()*COLORS.length|0]);
  el.style.left = Math.random()*100 + "vw";
  el.style.setProperty("--dx", (Math.random()*160-80) + "px");
  el.style.setProperty("--rot", (Math.random()*720-360) + "deg");
  const dur = 7 + Math.random()*6;
  el.style.animationDuration = dur + "s";
  el.style.transform = `scale(${.6+Math.random()*.7})`;
  $("petals").appendChild(el);
  setTimeout(() => el.remove(), dur*1000);
}
function startPetals(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let i=0;i<10;i++) setTimeout(petal, i*250);
  setInterval(petal, 900);
}

/* --- Paydo bo'lish --- */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} }), {threshold:.15});
document.querySelectorAll(".rv").forEach(el => io.observe(el));

/* --- Qolgan vaqt --- */
function tick(){
  let s = Math.max(0, Math.floor((d - Date.now())/1000));
  $("cd-d").textContent = Math.floor(s/86400); s%=86400;
  $("cd-h").textContent = String(Math.floor(s/3600)).padStart(2,"0"); s%=3600;
  $("cd-m").textContent = String(Math.floor(s/60)).padStart(2,"0");
  $("cd-s").textContent = String(s%60).padStart(2,"0");
}
tick(); setInterval(tick, 1000);

/* --- Toast --- */
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2200); }

/* --- Karta nusxalash --- */
$("copyBtn") && ($("copyBtn").onclick = async () => {
  const num = CONFIG.cardNumber.replace(/\s/g,"");
  try { await navigator.clipboard.writeText(num); }
  catch { const t=document.createElement("textarea"); t.value=num; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  toast("Karta raqami nusxalandi ✓");
});

/* --- Saqlash (shu qurilmada) --- */
const store = {
  get(k,def){ try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* --- Tashrif --- */
$("rsvp") && ($("rsvp").onsubmit = e => {
  e.preventDefault();
  store.set("rsvp", { name:$("rName").value, status:$("rStatus").value, count:$("rCount").value });
  $("rsvp").style.display = "none";
  $("rsvpOk").classList.add("show");
});
if ($("rsvp") && store.get("rsvp", null)) { $("rsvp").style.display="none"; $("rsvpOk").classList.add("show"); }

/* --- Tilaklar --- */
function esc(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function renderWishes(){
  const all = [...store.get("wishes", []), ...CONFIG.wishes];
  $("wishes").innerHTML = all.map(w => `<div class="wish"><b>${esc(w.name)}</b><p>${esc(w.text)}</p></div>`).join("");
}
$("wishForm").onsubmit = e => {
  e.preventDefault();
  const list = store.get("wishes", []);
  list.unshift({ name:$("wName").value.trim(), text:$("wText").value.trim() });
  store.set("wishes", list);
  e.target.reset(); renderWishes(); toast("Tilagingiz uchun rahmat 🌸");
};
renderWishes();
</script>
</body>
